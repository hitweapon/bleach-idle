<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-labelledby="title desc">
<title id="title">Uryū Ishida — Quincy</title><desc id="desc">Arqueiro Quincy com cabelo preto, óculos, uniforme branco e arco espiritual azul.</desc>
<defs>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".42" stop-color="#e0e9f7"/><stop offset=".75" stop-color="#a6bad4"/><stop offset="1" stop-color="#566b88"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24354e"/><stop offset=".55" stop-color="#111d31"/><stop offset="1" stop-color="#070d19"/></linearGradient>
 <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fcff"/><stop offset=".42" stop-color="#7be2ff"/><stop offset="1" stop-color="#4b7cff"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffe1c6"/><stop offset=".55" stop-color="#e2a98c"/><stop offset="1" stop-color="#ab6a60"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
